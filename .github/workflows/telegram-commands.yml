name: Telegram Commands

# Checks every few minutes whether the owner sent "스캔" to the Telegram bot
# and, if so, starts the weekly-scan workflow. GitHub may run scheduled jobs
# several minutes late.
on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: telegram-commands
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Standard library only: no dependency installation, so each check is quick.
      - name: Check Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 telegram_commands.py
